# belief_update sanity check 2: stigma_reducing @ initial ISMI 3.0 -> 2.0,
# 8 sessions x 11 turns, 1 persona (p_patient, symptom-described/no diagnosis
# label) x 1 repeat = 1 sample. 11 turns/session matches the production 1:1
# peer condition (run_belief_update_batch.sh: --agent-type peer --n-general 0
# --rounds 5 -- one commenter turn + one patient turn per round, plus one
# session-opening post: 1 + 5*2 = 11). Peer instructions (prompts.py) and
# intended_register (trajectories.py) are aligned to the production
# strategy_selector.py 5-strategy peer and persona_simple.STIGMA_TEMPLATE_BY_TIER,
# so belief_update is checked against text the production pipeline could
# actually produce, not the earlier NECT-marker/6-strategy-EPITOME design.
dataset_id: ismi_reducing_v2
model: gpt-5.5
generation:
  temperature: 0.7
  max_output_tokens: 8000
output_dir: data/synthetic
output_basename: ismi_reducing_v2
write_pretty_json: true
personas_file: personas.json
seed_base: 2000

conditions:
  - trajectory_type: stigma_reducing
    initial_ismi: 3.0
    session_count: 8
    turns_per_session: 11
    personas: [p_patient]
    repeats: 1
